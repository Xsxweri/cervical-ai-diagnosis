data:
  datasets:
    - type: "sipakmed"
      path: "data/sipakmed"
    - type: "herlev"
      path: "data/herlev"
  batch_size: 32
  img_size: 224
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

model:
  name: "efficientnet_b0"
  num_classes: 7
  pretrained: true
  label_space: "herlev"
  dropout_rate: 0.5
  model_type: "efficientnet_b0"  # 指定使用EfficientNet

training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 15
  min_delta: 0.001
  early_stopping_patience: 15

augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotation_range: 20
  brightness_range: [0.7, 1.3]
  contrast_range: [0.7, 1.3]

paths:
  model_save: "outputs/models"
  log_dir: "outputs/logs"
  result_dir: "outputs/results"

classification:
  mode: "binary"  # 默认为二分类模式，可选: binary, multiclass