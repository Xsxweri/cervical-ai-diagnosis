# EfficientNet-B2配置文件，适用于更精确的分类任务
data:
  datasets:
    - type: "sipakmed"
      path: "data/sipakmed"
    - type: "herlev"
      path: "data/herlev"
  batch_size: 16  # EfficientNet-B2较大，减小批次大小
  img_size: 260   # EfficientNet-B2推荐输入尺寸
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

model:
  name: "efficientnet_b2"
  num_classes: 7
  pretrained: true
  dropout_rate: 0.5
  model_type: "efficientnet_b2"
  use_attention: true
  attention_type: "cbam"

training:
  epochs: 150
  learning_rate: 0.0005  # 使用较小的学习率
  weight_decay: 0.0001
  patience: 15
  min_delta: 0.001
  early_stopping_patience: 20
  loss_type: "focal"
  use_sampler: true
  use_lr_warmup: true

augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotation_range: 30
  brightness_range: [0.7, 1.3]
  contrast_range: [0.7, 1.3]
  saturation_range: [0.7, 1.3]
  hue_range: [-0.2, 0.2]
  scale_range: [0.8, 1.2]
  shear_range: 15
  translate_range: 0.15
  random_erasing: true
  random_erasing_prob: 0.5
  mixup: true
  mixup_alpha: 0.2
  cutmix: true
  cutmix_alpha: 1.0

paths:
  model_save: "outputs/models"
  log_dir: "outputs/logs"
  result_dir: "outputs/results"

classification:
  mode: "multiclass"