# 宫颈细胞学 RAG 术语词表
# 修改需由熟悉细胞病理学的人员审校：错映射等价于在检索侧制造幻觉。
version: 1

# 规范术语白名单。LLM 改写输出必须逐字命中这里，否则被丢弃。
canonical:
  正常: [正常鳞状上皮, NILM, 未见上皮内病变]
  感染: [HPV感染, 挖空细胞, 人乳头瘤病毒, 非HPV16/18亚型]
  低级别: [LSIL, 低级别鳞状上皮内病变, 轻度异型增生, CIN1, CIN]
  高级别: [HSIL, 高级别鳞状上皮内病变, 中度异型增生, 重度异型增生, CIN2, CIN3]
  癌: [原位癌, CIS, 鳞状细胞癌, 浸润癌]
  不典型: [ASC-US, ASC-H, 意义未明的不典型鳞状细胞, 不典型鳞状细胞]
  形态: [核增大, 核深染, 核质比增高, 核膜不规则, 核拥挤重叠, 染色质颗粒状]
  处理: [阴道镜指征, 锥切, 活检, 随访间隔, HPV分型检测, 处理原则]
  检查: [细胞学检查, 阴道镜检查, HPV核酸检测, 联合筛查]
  随访: [12个月, 随访管理, 定期复查]

# 口语/变体 → 规范术语。target 必须出现在 canonical 中，否则加载时丢弃并告警。
alias:
  核大: 核增大
  细胞核大: 核增大
  核变大: 核增大
  核黑: 核深染
  颜色深: 核深染
  挤在一起: 核拥挤重叠
  重叠: 核拥挤重叠
  核不规则: 核膜不规则
  核形不规则: 核膜不规则
  癌前病变: 高级别鳞状上皮内病变
  上皮内瘤变: CIN
  挖空: 挖空细胞
  空泡细胞: 挖空细胞      # ← 需审校：空泡也可能是脂滴/退变
  不典型细胞: 不典型鳞状细胞
  意义不明: ASC-US
  怎么治: 处理原则
  怎么处理: 处理原则
  要不要做阴道镜: 阴道镜指征
  多久复查: 随访间隔
  TCT: 细胞学检查
  tct: 细胞学检查
  等一年: 12个月
  过一年: 12个月
  HPV52: 非HPV16/18亚型
  其他高危型HPV: 非HPV16/18亚型
  查阴道镜: 阴道镜检查

# 规范中文 → 拉丁缩写（语料中英混写时补 BM25 召回）
to_latin:
  高级别鳞状上皮内病变: HSIL
  低级别鳞状上皮内病变: LSIL
  人乳头瘤病毒: HPV
  宫颈上皮内瘤变: CIN
  原位癌: CIS

# 意图规则：按顺序匹配，命中第一条即返回
intent:
  - pattern: 首选|推荐|应选|如何选|怎么选|哪个更好|还是
    terms: [推荐意见, 推荐级别]
  - pattern: 处理|治疗|怎么办|方案|指征|处置|阴道镜|锥切|活检
    terms: [处理原则, 临床管理]
  - pattern: 进一步检查|如何检查|怎么检查|检查方法|检查流程
    terms: [进一步检查, 诊断流程]
  - pattern: 随访|复查|间隔|追踪
    terms: [随访管理, 复查间隔]
  - pattern: 鉴别|区分|区别|误诊|不像
    terms: [鉴别诊断, 鉴别要点]
  - pattern: 诊断|标准|判读|分级|定义
    terms: [诊断标准, 分级判读]
  - pattern: 机制|原因|病理|为什么|发生
    terms: [病理机制, 病因学]

default_intents: [形态学特征, 诊断标准]